modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
The sleep engine: server and client optimisations that keep the game's results exact - sleeping block entities and
mobs, a ring event bus, parallel world generation, chunk I/O, rendering - with measurement tools.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}-opt.mixins.json"

[[mixins]]
config="sleep-foreign-test.mixins.json"

[[mixins]]
config="sleep-geo.mixins.json"
[[mixins]]
config="sleep-flywheel.mixins.json"
