modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Sleepium: server and client optimisations that keep the game's results exact - idle block entities and mobs put to
sleep, a ring event bus, parallel world generation, chunk I/O, a renderer with its own shaderpack support (beta).
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}-opt.mixins.json"

[[mixins]]
config="sleepium-foreign-test.mixins.json"

[[mixins]]
config="sleepium-geo.mixins.json"
[[mixins]]
config="sleepium-flywheel.mixins.json"
[[mixins]]
config="sleepium-catnip.mixins.json"
[[mixins]]
config="sleepium-veil.mixins.json"
[[mixins]]
config="sleepium-shaders.mixins.json"
