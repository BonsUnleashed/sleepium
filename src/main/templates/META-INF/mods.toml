modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/ha7gawa/sleepium/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/sleepium"
# the mod list tells of a newer version (update.json on the repository's front page, updated with each release)
updateJSONURL = "https://raw.githubusercontent.com/ha7gawa/sleepium/main/update.json"
authors = "${mod_authors}"
description = '''
Minecraft performance that keeps the game exact: idle block entities and entities sleep until the exact tick vanilla
would act, every optimisation checked against vanilla by world and frame hashes.
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
